<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Reviews</title>
  <style>
    .card { border: 1px solid #ccc; padding: 12px; margin: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>التقييمات</h1>
  <div id="reviews"></div>

  <script>
    async function loadReviews() {
      const res = await fetch('http://localhost:3000/api/reviews')
      const data = await res.json()

      const container = document.getElementById('reviews')

      container.innerHTML = data.map(r => `
        <div class="card">
          <h3>${r.product?.title ?? 'منتج محذوف'}</h3>
          <p>السعر: ${r.product?.price ?? '-'}</p>
          <p>التقييم: ${r.rating} 😂😂</p>
          <p>${r.comment}</p>
        </div>
      `).join('')
    }

    loadReviews()
  </script>
</body>
</html>
